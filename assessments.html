<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment & Submissions | SAMCAM SOLUTIONS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Page Specific Styles */
    .portal-container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .portal-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
    @media (max-width: 768px) { .portal-grid { grid-template-columns: 1fr; } }
    
    .card-box { background: #ffffff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .card-box h3 { margin-bottom: 1rem; font-size: 1.2rem; color: #1e293b; display: flex; align-items: center; gap: 0.5rem; }
    
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; color: #475569; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 0.9rem;
    }
    .btn-submit {
      width: 100%; padding: 0.75rem; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn-submit:hover { background: #1d4ed8; }

    .test-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; background: #fafafa; }
    .test-header { display: flex; justify-content: space-between; align-items: center; }
    .test-title { font-weight: 700; font-size: 1.1rem; color: #0f172a; }
    .deadline-badge { font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 20px; font-weight: 600; }
    .deadline-active { background: #dcfce7; color: #15803d; }
    .deadline-expired { background: #fee2e2; color: #b91c1c; }

    .test-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .btn-action { padding: 0.5rem 0.8rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; border: none; }
    .btn-download { background: #0284c7; color: white; }
    .btn-upload { background: #16a34a; color: white; }
    .btn-disabled { background: #94a3b8; color: white; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION BAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="brand">
        <a href="index.html" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
          <img src="images/logo.png" alt="Samcam Solutions Logo" class="brand-logo">
          <div class="brand-text">
            <span class="brand-title">SAMCAM SOLUTION ICT RESOURCE HUB</span>
            <span class="brand-tagline">Innovative Insights In Action</span>
          </div>
        </a>
      </div>
      <div class="nav-actions">
        <a href="index.html" class="nav-portal-btn"><i class="fa-solid fa-house"></i> Home Library</a>
      </div>
    </div>
  </nav>

  <div class="portal-container">
    <h2><i class="fa-solid fa-file-pen"></i> Continuous Assessment & Test Portal</h2>
    <p style="color: #64748b; margin-bottom: 2rem;">Upload tests for learners, track set deadlines, and accept test submissions dynamically.</p>

    <div class="portal-grid">
      <!-- TEACHER PANEL: UPLOAD TEST -->
      <div class="card-box">
        <h3><i class="fa-solid fa-upload"></i> Teacher: Create Assessment</h3>
        <form id="assessmentForm" onsubmit="handleCreateTest(event)">
          <div class="form-group">
            <label for="testTitle">Assessment Title</label>
            <input type="text" id="testTitle" placeholder="e.g., S.4 End of Term ICT Practical Test" required>
          </div>
          <div class="form-group">
            <label for="targetClass">Class</label>
            <select id="targetClass" required>
              <option value="S.1">S.1</option>
              <option value="S.2">S.2</option>
              <option value="S.3">S.3</option>
              <option value="S.4">S.4</option>
              <option value="S.5">S.5</option>
              <option value="S.6">S.6</option>
            </select>
          </div>
          <div class="form-group">
            <label for="testDeadline">Submission Deadline</label>
            <input type="datetime-local" id="testDeadline" required>
          </div>
          <div class="form-group">
            <label for="testFile">Upload Test File (PDF/DOCX)</label>
            <input type="file" id="testFile" required>
          </div>
          <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Publish Assessment</button>
        </form>
      </div>

      <!-- LEARNER PANEL: VIEW & SUBMIT TESTS -->
      <div class="card-box">
        <h3><i class="fa-solid fa-list-check"></i> Available Assessments</h3>
        <div id="testContainer">
          <!-- Dynamic assessment items load here -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Sample Test Data
    let tests = [
      {
        id: 1,
        title: "S.4 Database Systems Practical Exercise",
        class: "S.4",
        deadline: "2026-08-10T23:59",
        fileUrl: "#"
      },
      {
        id: 2,
        title: "S.2 Word Processing & Spreadsheet Test",
        class: "S.2",
        deadline: "2026-08-01T12:00", // Past deadline example
        fileUrl: "#"
      }
    ];

    function renderTests() {
      const container = document.getElementById('testContainer');
      container.innerHTML = '';
      const now = new Date();

      tests.forEach(test => {
        const deadlineDate = new Date(test.deadline);
        const isExpired = now > deadlineDate;

        const html = `
          <div class="test-card">
            <div class="test-header">
              <span class="test-title">[${test.class}] ${test.title}</span>
              <span class="deadline-badge ${isExpired ? 'deadline-expired' : 'deadline-active'}">
                ${isExpired ? 'Expired' : 'Active'}
              </span>
            </div>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 0.5rem;">
              <i class="fa-regular fa-clock"></i> Deadline: ${deadlineDate.toLocaleString()}
            </p>
            <div class="test-actions">
              <a href="${test.fileUrl}" class="btn-action btn-download"><i class="fa-solid fa-download"></i> Download Questions</a>
              
              ${isExpired 
                ? `<button class="btn-action btn-disabled" disabled><i class="fa-solid fa-lock"></i> Deadline Passed</button>`
                : `<label class="btn-action btn-upload" style="cursor:pointer;">
                     <i class="fa-solid fa-file-arrow-up"></i> Submit Attempt
                     <input type="file" style="display:none;" onchange="handleSubmission('${test.title}', this)">
                   </label>`
              }
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    function handleCreateTest(e) {
      e.preventDefault();
      const title = document.getElementById('testTitle').value;
      const targetClass = document.getElementById('targetClass').value;
      const deadline = document.getElementById('testDeadline').value;

      tests.unshift({
        id: Date.now(),
        title: title,
        class: targetClass,
        deadline: deadline,
        fileUrl: "#"
      });

      alert("Assessment published successfully!");
      document.getElementById('assessmentForm').reset();
      renderTests();
    }

    function handleSubmission(title, input) {
      if (input.files.length > 0) {
        alert(`Successfully submitted attempt for "${title}"!`);
      }
    }

    // Initial Render
    renderTests();
  </script>
</body>
</html>
