<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Classes & Google Meet Management | SAMCAM SOLUTIONS ICT HUB</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  
  <!-- Page Specific CSS -->
  <link rel="stylesheet" href="classes.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- Google API GIS & Calendar Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>

  <!-- NAVBAR -->
  <header class="portal-header">
    <div class="header-container">
      <div class="logo-area">
        <i class="fa-solid fa-graduation-cap logo-icon"></i>
        <span>SAMCAM <small>ICT HUB</small></span>
      </div>
      <nav class="nav-links">
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="assessments.html"><i class="fa-solid fa-file-lines"></i> Assessments</a>
        <a href="classes.html" class="active"><i class="fa-solid fa-video"></i> Live Classes</a>
        <a href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
      </nav>
      <div class="header-actions">
        <button id="themeToggleBtn" class="btn-icon-only" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">
    <div class="page-title-section">
      <div>
        <h1>Virtual Classrooms & Google Meet</h1>
        <p>Schedule interactive video lessons, automatically generate Meet links, and join live sessions.</p>
      </div>
      <button id="openScheduleModalBtn" class="btn-action btn-upload" onclick="openScheduleModal()">
        <i class="fa-solid fa-plus"></i> Schedule New Class
      </button>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-toolbar">
      <div class="segmented-control" id="classFilterGroup">
        <button class="segment-btn active" onclick="filterClass('ALL', event)">All Classes</button>
        <button class="segment-btn" onclick="filterClass('S1', event)">S.1</button>
        <button class="segment-btn" onclick="filterClass('S2', event)">S.2</button>
        <button class="segment-btn" onclick="filterClass('S3', event)">S.3</button>
        <button class="segment-btn" onclick="filterClass('S4', event)">S.4</button>
        <button class="segment-btn" onclick="filterClass('S5', event)">S.5</button>
        <button class="segment-btn" onclick="filterClass('S6', event)">S.6</button>
      </div>
    </div>

    <!-- CLASSES GRID -->
    <div id="classes-grid" class="classes-grid">
      <!-- Dynamic Class Cards Render Here -->
    </div>
  </main>

  <!-- SCHEDULING MODAL -->
  <div id="scheduleModal" class="modal-overlay" style="display:none;" onclick="closeScheduleModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-calendar-plus"></i> Schedule Google Meet Class</h3>
        <button class="btn-icon-only" onclick="closeScheduleModalDirect()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="scheduleForm" onsubmit="handleScheduleSubmit(event)">
        <div class="form-group">
          <label>Class Title / Topic</label>
          <input type="text" id="classTitle" required placeholder="e.g., Advanced Spreadsheet XLOOKUP & Nested IF">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Target Level</label>
            <select id="classLevel" required>
              <option value="S1">Senior 1</option>
              <option value="S2">Senior 2</option>
              <option value="S3">Senior 3</option>
              <option value="S4">Senior 4</option>
              <option value="S5">Senior 5</option>
              <option value="S6">Senior 6</option>
            </select>
          </div>
          <div class="form-group">
            <label>Instructor Name</label>
            <input type="text" id="instructorName" required placeholder="e.g., Mr. Sam">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Start Date & Time</label>
            <input type="datetime-local" id="startTime" required>
          </div>
          <div class="form-group">
            <label>End Date & Time</label>
            <input type="datetime-local" id="endTime" required>
          </div>
        </div>
        <div class="form-group">
          <label>Description / Instructions</label>
          <textarea id="classDescription" rows="3" placeholder="Brief overview or preparation notes for students..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-action btn-secondary" onclick="closeScheduleModalDirect()">Cancel</button>
          <button type="submit" class="btn-action btn-upload" id="submitClassBtn">
            <i class="fa-solid fa-video"></i> Create Meet & Schedule
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Engine -->
  <script src="classes.js"></script>
</body>
</html>
