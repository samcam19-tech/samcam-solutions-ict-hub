<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Classes & Google Meet Management | SAMCAM SOLUTIONS ICT HUB</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  
  <!-- Page Specific CSS -->
  <link rel="stylesheet" href="classes.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- Google API GIS & Calendar Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- NAVBAR -->
  <header class="portal-header">
    <div class="header-container">
      <div class="logo-area">
        <i class="fa-solid fa-graduation-cap logo-icon"></i>
        <span>SAMCAM <small>ICT HUB</small></span>
      </div>

      <!-- Hamburger Menu Toggle Button -->
      <button id="mobileMenuToggle" class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle Navigation">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Collapsible Navigation & Actions Container -->
      <div class="nav-collapse-wrapper" id="navCollapseWrapper">
        <nav class="nav-links">
          <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
          <a href="assessments.html"><i class="fa-solid fa-file-lines"></i> Assessments</a>
          <a href="classes.html" class="active"><i class="fa-solid fa-video"></i> Live Classes</a>
          <a href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        </nav>
        <div class="header-actions">
          <!-- User Profile Widget -->
          <div id="userProfileWidget" class="user-profile-widget">
            <img id="navProfilePic" src="images/default-avatar.png" alt="Profile">
            <div class="user-info-text">
              <span id="navFullName">User Name</span>
              <span id="navUsername">@username</span>
            </div>
          </div>
          <button id="themeToggleBtn" class="btn-icon-only" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">
    <div class="page-title-section">
      <div>
        <h1>Virtual Classrooms & Google Meet</h1>
        <p id="pageSubtitle">Loading session details...</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="openAttendanceModalBtn" class="btn-action btn-secondary teacher-only" onclick="openAttendanceModal()">
          <i class="fa-solid fa-clipboard-user"></i> View Attendance Log
        </button>
        <button id="openScheduleModalBtn" class="btn-action btn-upload teacher-only" onclick="openScheduleModal()" style="display: none;">
          <i class="fa-solid fa-plus"></i> Schedule New Class
        </button>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-toolbar">
      <div class="segmented-control" id="classFilterGroup">
        <button class="segment-btn active" onclick="filterClass('ALL', event)">All Classes</button>
        <button class="segment-btn" onclick="filterClass('S1', event)">S.1</button>
        <button class="segment-btn" onclick="filterClass('S2', event)">S.2</button>
        <button class="segment-btn" onclick="filterClass('S3', event)">S.3</button>
        <button class="segment-btn" onclick="filterClass('S4', event)">S.4</button>
        <button class="segment-btn" onclick="filterClass('S5', event)">S.5</button>
        <button class="segment-btn" onclick="filterClass('S6', event)">S.6</button>
      </div>
    </div>

    <!-- CLASSES GRID -->
    <div id="classes-grid" class="classes-grid">
      <!-- Dynamic Class Cards Render Here -->
    </div>
  </main>

  <!-- SCHEDULING MODAL -->
  <div id="scheduleModal" class="modal-overlay" style="display:none;" onclick="closeScheduleModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-calendar-plus"></i> Create Google Meet Class</h3>
        <button class="btn-icon-only" onclick="closeScheduleModalDirect()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="scheduleForm" onsubmit="handleScheduleSubmit(event)">
        <div class="form-group">
          <label>Meeting Type</label>
          <select id="meetingMode" class="form-control" onchange="toggleMeetingMode()">
            <option value="instant">Instant Meeting (Start Now)</option>
            <option value="scheduled">Schedule for Later</option>
          </select>
        </div>
        <div class="form-group">
          <label>Class Title / Topic</label>
          <input type="text" id="classTitle" required placeholder="e.g., Advanced Spreadsheet XLOOKUP & Nested IF">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Target Level</label>
            <select id="classLevel" required>
              <option value="S1">Senior 1</option>
              <option value="S2">Senior 2</option>
              <option value="S3">Senior 3</option>
              <option value="S4">Senior 4</option>
              <option value="S5">Senior 5</option>
              <option value="S6">Senior 6</option>
            </select>
          </div>
          <div class="form-group">
            <label>Instructor Name</label>
            <input type="text" id="instructorName" required placeholder="e.g., Mr. Sam">
          </div>
        </div>
        
        <!-- Date fields container that toggles visibility based on meeting mode -->
        <div id="dateTimeFieldsContainer" class="form-row" style="display: none;">
          <div class="form-group">
            <label>Start Date & Time</label>
            <input type="datetime-local" id="startTime">
          </div>
          <div class="form-group">
            <label>End Date & Time</label>
            <input type="datetime-local" id="endTime">
          </div>
        </div>

        <div class="form-group">
          <label>Meeting Access Control</label>
          <select id="admissionType" class="form-control">
            <option value="open">Open (Anyone with the link can join directly)</option>
            <option value="restricted">Restricted / Require Admission (Students wait in waiting room to be admitted)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Description / Instructions</label>
          <textarea id="classDescription" rows="3" placeholder="Brief overview or preparation notes for students..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-action btn-secondary" onclick="closeScheduleModalDirect()">Cancel</button>
          <button type="submit" class="btn-action btn-upload" id="submitClassBtn">
            <i class="fa-solid fa-video"></i> Create Meet & Launch
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ATTENDANCE LOG MODAL -->
  <div id="attendanceModal" class="modal-overlay" style="display:none;" onclick="closeAttendanceModal(event)">
    <div class="modal-card" style="max-width: 800px; width: 90%;">
      <div class="modal-header">
        <h3><i class="fa-solid fa-clipboard-user"></i> Meeting Attendance Log</h3>
        <button class="btn-icon-only" onclick="closeAttendanceModalDirect()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <p style="color: var(--text-muted); font-size: 0.9rem;">Record of user interactions and joined sessions.</p>
        <button onclick="exportAttendanceCSV()" class="btn-action btn-upload" style="padding: 6px 12px; font-size: 0.85rem;"><i class="fa-solid fa-file-arrow-down"></i> Export CSV</button>
      </div>
      <div style="max-height: 400px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
          <thead style="background: var(--bg-card-subtle); position: sticky; top: 0; z-index: 1;">
            <tr>
              <th style="padding: 10px; border-bottom: 1px solid var(--border-color);">Timestamp</th>
              <th style="padding: 10px; border-bottom: 1px solid var(--border-color);">User Name</th>
              <th style="padding: 10px; border-bottom: 1px solid var(--border-color);">Role / Class</th>
              <th style="padding: 10px; border-bottom: 1px solid var(--border-color);">Action / Class Joined</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody">
            <!-- Dynamic rows will render here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JavaScript Engine -->

  <!-- Profile Widget Auto-Hydration Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Retrieve current session safely
      const sessionStr = localStorage.getItem('portal_session') || sessionStorage.getItem('portal_session');
      if (sessionStr) {
        try {
          const session = JSON.parse(sessionStr);
          
          // 2. Resolve Profile Picture (checking multiple property names)
          const picUrl = session.profilePic || session.photoURL || session.avatar || session.image;
          const picEl = document.getElementById('navProfilePic');
          if (picEl && picUrl) {
            picEl.src = picUrl;
          }

          // 3. Resolve Full Name & Username
          const nameEl = document.getElementById('navFullName');
          if (nameEl) {
            nameEl.textContent = session.name || session.fullName || 'User Name';
          }

          const usernameEl = document.getElementById('navUsername');
          if (usernameEl) {
            const rawUsername = session.username || session.user || 'username';
            usernameEl.textContent = rawUsername.startsWith('@') ? rawUsername : `@${rawUsername}`;
          }

          // 4. Trigger live class session syncing if the function exists
          if (typeof syncLiveClassSession === 'function') {
            syncLiveClassSession(session);
          }
        } catch (e) {
          console.error("Failed to hydrate navigation profile:", e);
        }
      }
    });
  </script>
  <script src="classes.js"></script>
</body>
</html>
