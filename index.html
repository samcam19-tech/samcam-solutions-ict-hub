<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMCAM SOLUTIONS ICT HUB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER WITH BANNER & LOGO -->
  <header class="hero-banner">
    <div class="banner-overlay">
      <div class="header-content">
        <img src="images/logo.png" alt="Samcam Solutions Logo" class="site-logo">
        <div class="header-text">
          <h1>SAMCAM SOLUTIONS ICT HUB</h1>
          <p>Academic Resource Portal for S.1 to S.6 ICT Studies</p>
        </div>
      </div>
    </div>
  </header>

  <!-- COVER IMAGE BELOW HEADER -->
  <section class="cover-image-container">
    <img src="images/banner-bg.png" alt="ICT Hub Cover Banner" class="cover-image">
  </section>

  <main class="container">
    <section class="controls">
      <!-- CLASS FILTERS FOR S1 THROUGH S6 -->
      <div class="filter-group">
        <label>Class:</label>
        <button class="btn filter-btn active" onclick="filterClass('ALL')">All</button>
        <button class="btn filter-btn" onclick="filterClass('S1')">S.1</button>
        <button class="btn filter-btn" onclick="filterClass('S2')">S.2</button>
        <button class="btn filter-btn" onclick="filterClass('S3')">S.3</button>
        <button class="btn filter-btn" onclick="filterClass('S4')">S.4</button>
        <button class="btn filter-btn" onclick="filterClass('S5')">S.5</button>
        <button class="btn filter-btn" onclick="filterClass('S6')">S.6</button>
      </div>

      <!-- CATEGORY FILTERS -->
      <div class="filter-group">
        <label>Category:</label>
        <button class="btn cat-btn active" onclick="filterCategory('ALL')">All</button>
        <button class="btn cat-btn" onclick="filterCategory('Notes')">Notes</button>
        <button class="btn cat-btn" onclick="filterCategory('Question Paper')">Question Papers</button>
        <button class="btn cat-btn" onclick="filterCategory('Marking Guide')">Marking Guides</button>
      </div>
    </section>

    <section id="resource-grid" class="grid"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
