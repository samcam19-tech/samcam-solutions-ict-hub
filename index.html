<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMCAM SOLUTIONS ICT HUB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER BANNER WITH LOGO -->
  <header class="hero-banner">
    <div class="banner-overlay">
      <div class="header-content">
        <img src="images/logo.png" alt="Samcam Solutions Logo" class="site-logo">
        <div class="header-text">
          <h1>SAMCAM SOLUTIONS ICT HUB</h1>
          <p>Academic Resource Portal for S.4 & S.6 ICT Studies</p>
        </div>
      </div>
    </div>
  </header>

  <!-- COVER PHOTO SECTION WITH CLASS & CATEGORY ON TOP -->
  <section class="cover-hero">
    <div class="cover-overlay">
      <div class="controls-overlay">
        
        <!-- CLASS FILTERS -->
        <div class="filter-group">
          <label>Class:</label>
          <div class="button-wrap">
            <button class="btn filter-btn active" onclick="filterClass('ALL')">All</button>
            <button class="btn filter-btn" onclick="filterClass('S1')">Senior 1</button>
            <button class="btn filter-btn" onclick="filterClass('S2')">Senior 2</button>
            <button class="btn filter-btn" onclick="filterClass('S3')">Senior 3</button>
            <button class="btn filter-btn" onclick="filterClass('S4')">Senior 4</button>
            <button class="btn filter-btn" onclick="filterClass('S5')">Senior 5</button>
            <button class="btn filter-btn" onclick="filterClass('S6')">Senior 6</button>
          </div>
        </div>

        <!-- CATEGORY FILTERS -->
        <div class="filter-group">
          <label>Category:</label>
          <div class="button-wrap">
            <button class="btn cat-btn active" onclick="filterCategory('ALL')">All</button>
            <button class="btn cat-btn" onclick="filterCategory('Notes')">Notes</button>
            <button class="btn cat-btn" onclick="filterCategory('Question Paper')">Question Papers</button>
            <button class="btn cat-btn" onclick="filterCategory('Marking Guide')">Marking Guides</button>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- RESOURCE GRID CONTAINER -->
  <main class="container">
    <section id="resource-grid" class="grid"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
